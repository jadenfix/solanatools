name: Solana offline paper replay

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: solana-paper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/unit tests/integration
        working-directory: solana-bot

  browser-and-media:
    name: Browser E2E and media integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solana-bot/browser-tests/package-lock.json
      - run: npm ci
        working-directory: solana-bot/browser-tests
      - run: npx playwright-core install --with-deps chromium
        working-directory: solana-bot/browser-tests
      - run: npm test
        working-directory: solana-bot/browser-tests
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/verify_demo_media.py
        working-directory: solana-bot
      - name: Tests leave a clean checkout
        run: test -z "$(git status --porcelain)"
